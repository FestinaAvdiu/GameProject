<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Web Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #5568d3;
        }

        button.secondary {
            background: #95a5a6;
        }

        button.secondary:hover {
            background: #7f8c8d;
        }

        .room-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .room-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .room-item:hover {
            background: #e9ecef;
        }

        .room-item h3 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .room-item p {
            color: #666;
            font-size: 14px;
        }

        .game-screen {
            text-align: center;
        }

        .status-message {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            color: #2c3e50;
        }

        .moves-container {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }

        .move-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 3px solid #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }

        .move-btn:hover {
            transform: scale(1.1);
            background: #667eea;
        }

        .move-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .scores {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .score-item {
            text-align: center;
        }

        .score-item h3 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .score-item .score {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
        }

        .message-log {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .message-log p {
            margin: 5px 0;
            color: #555;
        }

        .no-rooms {
            text-align: center;
            color: #666;
            padding: 40px 20px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Rock Paper Scissors</h1>

        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="input-group">
                <label for="usernameInput">Enter your username:</label>
                <input type="text" id="usernameInput" placeholder="Your username">
            </div>
            <button onclick="login()">Login</button>
            <div id="loginError"></div>
        </div>

        <!-- Menu Screen -->
        <div id="menuScreen" class="screen">
            <h2 style="text-align: center; margin-bottom: 20px;">Welcome, <span id="usernameDisplay"></span>!</h2>
            <button onclick="showCreateRoom()">Create New Room</button>
            <button onclick="showJoinRoom()">Join Room by ID</button>
            <button onclick="showRoomList()">View Available Rooms</button>
            <button class="secondary" onclick="logout()">Logout</button>
        </div>

        <!-- Create Room Screen -->
        <div id="createRoomScreen" class="screen">
            <div class="input-group">
                <label for="roomNameInput">Room Name:</label>
                <input type="text" id="roomNameInput" placeholder="Enter room name">
            </div>
            <button onclick="createRoom()">Create Room</button>
            <button class="secondary" onclick="showMenu()">Back</button>
            <div id="createRoomError"></div>
        </div>

        <!-- Join Room Screen -->
        <div id="joinRoomScreen" class="screen">
            <div class="input-group">
                <label for="roomIdInput">Room ID:</label>
                <input type="text" id="roomIdInput" placeholder="Enter room ID">
            </div>
            <button onclick="joinRoomById()">Join Room</button>
            <button class="secondary" onclick="showMenu()">Back</button>
            <div id="joinRoomError"></div>
        </div>

        <!-- Room List Screen -->
        <div id="roomListScreen" class="screen">
            <h2 style="text-align: center; margin-bottom: 20px;">Available Rooms</h2>
            <div id="roomList" class="room-list"></div>
            <button onclick="showCreateRoom()">Create New Room</button>
            <button class="secondary" onclick="showMenu()">Back</button>
        </div>

        <!-- Waiting Screen -->
        <div id="waitingScreen" class="screen">
            <h2 style="text-align: center;">Waiting for opponent...</h2>
            <div class="status-message">
                <p>Room ID: <strong><span id="currentRoomId"></span></strong></p>
                <p>Share this ID with another player!</p>
            </div>
            <button class="secondary" onclick="leaveRoom()">Leave Room</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="status-message" id="gameStatus">Waiting...</div>
            
            <div class="scores">
                <div class="score-item">
                    <h3 id="player1Name">Player 1</h3>
                    <div class="score" id="player1Score">0</div>
                </div>
                <div class="score-item">
                    <h3 id="player2Name">Player 2</h3>
                    <div class="score" id="player2Score">0</div>
                </div>
            </div>

            <div id="movesContainer" class="moves-container" style="display: none;">
                <button class="move-btn" onclick="makeMove('rock')">✊</button>
                <button class="move-btn" onclick="makeMove('paper')">✋</button>
                <button class="move-btn" onclick="makeMove('scissors')">✌️</button>
            </div>

            <div class="message-log" id="messageLog"></div>
        </div>
    </div>

    <script>
        const USER_SERVICE = 'http://localhost:8001';
        const ROOM_SERVICE = 'http://localhost:8002';
        const GAME_SERVICE = 'ws://localhost:8003';

        let username = '';
        let currentRoomId = '';
        let ws = null;
        let gameState = {
            players: [],
            scores: {},
            round: 1
        };

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<div class="error">${message}</div>`;
            setTimeout(() => el.innerHTML = '', 3000);
        }

        async function login() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) {
                showError('loginError', 'Please enter a username');
                return;
            }

            try {
                const response = await fetch(`${USER_SERVICE}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: input })
                });

                if (response.ok) {
                    username = input;
                    document.getElementById('usernameDisplay').textContent = username;
                    showMenu();
                } else {
                    showError('loginError', 'Login failed. Please try again.');
                }
            } catch (error) {
                showError('loginError', 'Cannot connect to server');
            }
        }

        function logout() {
            username = '';
            currentRoomId = '';
            if (ws) ws.close();
            showScreen('loginScreen');
        }

        function showMenu() {
            showScreen('menuScreen');
        }

        function showCreateRoom() {
            showScreen('createRoomScreen');
        }

        function showJoinRoom() {
            showScreen('joinRoomScreen');
        }

        async function createRoom() {
            const roomName = document.getElementById('roomNameInput').value.trim();
            if (!roomName) {
                showError('createRoomError', 'Please enter a room name');
                return;
            }

            try {
                const response = await fetch(`${ROOM_SERVICE}/create_room`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room_name: roomName, creator: username })
                });

                const data = await response.json();
                if (response.ok) {
                    currentRoomId = data.room_id;
                    document.getElementById('currentRoomId').textContent = currentRoomId;
                    connectWebSocket();
                    showScreen('waitingScreen');
                } else {
                    showError('createRoomError', data.detail || 'Failed to create room');
                }
            } catch (error) {
                showError('createRoomError', 'Cannot connect to server');
            }
        }

        async function joinRoomById() {
            const roomId = document.getElementById('roomIdInput').value.trim();
            if (!roomId) {
                showError('joinRoomError', 'Please enter a room ID');
                return;
            }

            await joinRoom(roomId);
        }

        async function joinRoom(roomId) {
            try {
                const response = await fetch(`${ROOM_SERVICE}/join_room`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room_id: roomId, username: username })
                });

                const data = await response.json();
                if (response.ok) {
                    currentRoomId = roomId;
                    connectWebSocket();
                    showScreen('gameScreen');
                } else {
                    showError('joinRoomError', data.detail || 'Failed to join room');
                }
            } catch (error) {
                showError('joinRoomError', 'Cannot connect to server');
            }
        }

        async function showRoomList() {
            try {
                const response = await fetch(`${ROOM_SERVICE}/rooms`);
                const data = await response.json();
                const rooms = data.rooms;

                const roomListEl = document.getElementById('roomList');
                
                if (Object.keys(rooms).length === 0) {
                    roomListEl.innerHTML = '<div class="no-rooms">No rooms available. Create one!</div>';
                } else {
                    roomListEl.innerHTML = '';
                    for (const [roomId, room] of Object.entries(rooms)) {
                        if (room.status === 'waiting') {
                            const roomDiv = document.createElement('div');
                            roomDiv.className = 'room-item';
                            roomDiv.onclick = () => joinRoom(roomId);
                            roomDiv.innerHTML = `
                                <h3>${room.name}</h3>
                                <p>Players: ${room.players.length}/2 (${room.players.join(', ')})</p>
                                <p>Room ID: ${roomId}</p>
                            `;
                            roomListEl.appendChild(roomDiv);
                        }
                    }
                }

                showScreen('roomListScreen');
            } catch (error) {
                alert('Cannot fetch rooms');
            }
        }

        function connectWebSocket() {
            const wsUrl = `${GAME_SERVICE}/ws/${currentRoomId}/${username}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                addMessage('Connected to game server');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleGameMessage(data);
            };

            ws.onclose = () => {
                addMessage('Disconnected from game');
            };

            ws.onerror = (error) => {
                addMessage('Connection error');
            };
        }

        function handleGameMessage(data) {
            const type = data.type;

            if (type === 'player_joined') {
                addMessage(data.message);
            } else if (type === 'game_start') {
                showScreen('gameScreen');
                addMessage(data.message);
                gameState.round = data.round;
            } else if (type === 'your_turn') {
                document.getElementById('gameStatus').textContent = "🎯 Your turn! Choose your move:";
                document.getElementById('movesContainer').style.display = 'flex';
            } else if (type === 'waiting') {
                document.getElementById('gameStatus').textContent = `⏳ ${data.message}`;
                document.getElementById('movesContainer').style.display = 'none';
            } else if (type === 'move_made') {
                addMessage(data.message);
            } else if (type === 'round_result') {
                document.getElementById('movesContainer').style.display = 'none';
                addMessage(`Round ${data.round}: ${data.result}`);
                addMessage(`Moves: ${Object.entries(data.moves).map(([p, m]) => `${p}: ${m}`).join(', ')}`);
                
                // Update scores
                gameState.scores = data.scores;
                updateScores();
            } else if (type === 'new_round') {
                addMessage(data.message);
                gameState.round = data.round;
            } else if (type === 'game_over') {
                document.getElementById('movesContainer').style.display = 'none';
                document.getElementById('gameStatus').textContent = `🎉 ${data.message}`;
                addMessage(`🏆 Game Over! ${data.message}`);
                
                setTimeout(() => {
                    if (ws) ws.close();
                    showMenu();
                }, 5000);
            } else if (type === 'error') {
                addMessage(`❌ ${data.message}`);
            }
        }

        function updateScores() {
            const players = Object.keys(gameState.scores);
            if (players.length >= 2) {
                document.getElementById('player1Name').textContent = players[0];
                document.getElementById('player1Score').textContent = gameState.scores[players[0]];
                document.getElementById('player2Name').textContent = players[1];
                document.getElementById('player2Score').textContent = gameState.scores[players[1]];
            }
        }

        function makeMove(move) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'move', move: move }));
                document.getElementById('movesContainer').style.display = 'none';
                document.getElementById('gameStatus').textContent = `You chose: ${move}`;
                addMessage(`You chose: ${move}`);
            }
        }

        function addMessage(msg) {
            const log = document.getElementById('messageLog');
            const p = document.createElement('p');
            p.textContent = msg;
            log.appendChild(p);
            log.scrollTop = log.scrollHeight;
        }

        function leaveRoom() {
            if (ws) ws.close();
            showMenu();
        }
    </script>
</body>
</html>
